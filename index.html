<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medic Info Gabon</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <div class="logo">⚕️</div>
    <h1>MEDIC INFO GABON</h1>
    <p>Trouvez un établissement de santé CNAMGS</p>
</header>


<!-- ACCUEIL -->
<section id="accueil" class="page active">

<h2>Bienvenue</h2>

<p>
Recherchez facilement un hôpital ou une pharmacie
dans votre province.
</p>

<button onclick="ouvrirProvince()">
Commencer
</button>

</section>



<!-- PROVINCES -->
<section id="provinces" class="page">

<h2>Choisir une province</h2>

<select id="choixProvince" onchange="selectionProvince()">

<option value="">
-- Sélectionner --
</option>

<option>Estuaire</option>
<option>Haut-Ogooué</option>
<option>Moyen-Ogooué</option>
<option>Ngounié</option>
<option>Nyanga</option>
<option>Ogooué-Ivindo</option>
<option>Ogooué-Lolo</option>
<option>Ogooué-Maritime</option>
<option>Woleu-Ntem</option>

</select>


<button onclick="retourAccueil()">
⬅️ Retour
</button>


</section>




<!-- SERVICES -->
<section id="services" class="page">

<h2 id="nomProvince"></h2>


<div class="menu">

<button onclick="afficherHopitaux()">
🏥 Hôpitaux
</button>


<button onclick="afficherPharmacies()">
💊 Pharmacies
</button>


<button onclick="retourProvince()">
⬅️ Retour
</button>


</div>


</section>





<!-- RESULTATS -->
<section id="resultats" class="page">

<h2 id="titre"></h2>


<div id="liste"></div>


<button onclick="retourServices()">
⬅️ Retour
</button>


</section>





<script src="etablissements.js"></script>
<script src="app.js"></script>


</body>
</html>
